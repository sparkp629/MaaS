# /etc/nginx/sites-available/maas.conf
#
# 1) Remplacer maas.example.com par votre domaine
# 2) Activer le site:
#    sudo ln -s /etc/nginx/sites-available/maas.conf /etc/nginx/sites-enabled/maas.conf
# 3) Vérifier puis recharger:
#    sudo nginx -t && sudo systemctl reload nginx
#
# Option HTTPS (recommandé):
#   sudo certbot --nginx -d maas.example.com

upstream maas_backend {
    server 127.0.0.1:3001;
    keepalive 32;
}

server {
    listen 80;
    listen [::]:80;
    server_name maas.example.com;

    # Réduit la surface d'attaque sur les requêtes volumineuses
    client_max_body_size 2m;

    # Headers de base sécurité
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # API + frontend (servis par Express en mode production)
    location / {
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";
        proxy_pass http://maas_backend;
    }
}
