name: Sync GitHub Secrets to Vercel

on:
  workflow_dispatch: {}

jobs:
  sync-secrets:
    runs-on: ubuntu-latest
    steps:
      - name: Prepare
        run: |
          apt-get update -y && apt-get install -y jq curl

      - name: Sync secrets to Vercel
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
          REDIS_URL: ${{ secrets.REDIS_URL }}
          STRIPE_SECRET_KEY: ${{ secrets.STRIPE_SECRET_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          API_KEY_SUPABASE: ${{ secrets.API_KEY_SUPABASE }}
        shell: bash
        run: |
          if [ -z "$VERCEL_TOKEN" ] || [ -z "$VERCEL_PROJECT_ID" ]; then
            echo "VERCEL_TOKEN or VERCEL_PROJECT_ID not set"; exit 1
          fi

          set -euo pipefail

          declare -A items=(
            [REDIS_URL]="$REDIS_URL"
            [STRIPE_SECRET_KEY]="$STRIPE_SECRET_KEY"
            [OPENAI_API_KEY]="$OPENAI_API_KEY"
            [ANTHROPIC_API_KEY]="$ANTHROPIC_API_KEY"
            [SUPABASE_URL]="$SUPABASE_URL"
            [API_KEY_SUPABASE]="$API_KEY_SUPABASE"
          )

          for key in "${!items[@]}"; do
            value="${items[$key]}"
            if [ -z "$value" ]; then
              echo "Skipping $key (empty)"
              continue
            fi

            echo "Syncing $key..."
            # find existing env id
            existing_id=$(curl -s -H "Authorization: Bearer $VERCEL_TOKEN" "https://api.vercel.com/v9/projects/$VERCEL_PROJECT_ID/env" | jq -r --arg k "$key" '.envs[]? | select(.key==$k) | .id' | head -n1 || true)
            if [ -n "$existing_id" ] && [ "$existing_id" != "null" ]; then
              echo "Deleting existing $key (id=$existing_id)"
              curl -s -X DELETE -H "Authorization: Bearer $VERCEL_TOKEN" "https://api.vercel.com/v9/projects/$VERCEL_PROJECT_ID/env/$existing_id" >/dev/null
            fi

            echo "Creating $key"
            body=$(jq -n --arg k "$key" --arg v "$value" '{key:$k, value:$v, target:["production"]}')
            curl -s -X POST "https://api.vercel.com/v9/projects/$VERCEL_PROJECT_ID/env" -H "Authorization: Bearer $VERCEL_TOKEN" -H "Content-Type: application/json" -d "$body" >/dev/null
            echo "$key synced"
          done

      - name: Done
        run: echo "Secrets synced to Vercel"
