name: Deploy VPS (minimal)

on:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      branch:
        description: Branche à déployer
        required: true
        default: main

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.branch || github.ref_name }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: |
            backend/package-lock.json
            frontend/package-lock.json

      - name: Install dependencies
        run: npm run setup

      - name: Smoke backend
        run: npm run smoke

      - name: Build frontend
        run: npm run build

  deploy:
    needs: verify
    runs-on: ubuntu-latest
    if: ${{ github.event_name == 'workflow_dispatch' || github.ref == 'refs/heads/main' }}
    steps:
      - name: Deploy over SSH
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: ${{ secrets.VPS_PORT || 22 }}
          script_stop: true
          script: |
            set -euo pipefail
            export APP_DIR="${{ secrets.VPS_APP_DIR }}"
            export SERVICE_NAME="${{ secrets.VPS_SERVICE_NAME }}"
            export HEALTHCHECK_URL="${{ secrets.VPS_HEALTHCHECK_URL }}"
            export DEPLOY_BRANCH="${{ github.event_name == 'workflow_dispatch' && github.event.inputs.branch || github.ref_name }}"

            APP_DIR_VALUE="${APP_DIR:-/opt/maas/current}"
            export APP_DIR="$APP_DIR_VALUE"

            bash "$APP_DIR_VALUE/infra/scripts/deploy.sh"
