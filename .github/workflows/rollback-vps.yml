name: Rollback VPS (N-1 or target commit)

on:
  workflow_dispatch:
    inputs:
      target_commit:
        description: "Commit cible (optionnel). Vide = N-1"
        required: false
        default: ""

permissions:
  contents: read

jobs:
  rollback:
    runs-on: ubuntu-latest
    steps:
      - name: Rollback over SSH
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: ${{ secrets.VPS_PORT || 22 }}
          script_stop: true
          script: |
            set -euo pipefail
            export APP_DIR="${{ secrets.VPS_APP_DIR }}"
            export SERVICE_NAME="${{ secrets.VPS_SERVICE_NAME }}"
            export HEALTHCHECK_URL="${{ secrets.VPS_HEALTHCHECK_URL }}"
            export ROLLBACK_TARGET="${{ github.event.inputs.target_commit }}"

            APP_DIR_VALUE="${APP_DIR:-/opt/maas/current}"
            export APP_DIR="$APP_DIR_VALUE"

            bash "$APP_DIR_VALUE/infra/scripts/rollback-last.sh"
